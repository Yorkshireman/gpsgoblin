name: Quality

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  merge_group:

permissions:
  contents: read

jobs:
  quality:
    name: Complete quality suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deliberately fail to verify branch protection
        run: exit 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit and integration tests
        run: pnpm test --runInBand
      - name: Check types
        run: pnpm tsc
      - name: Lint
        run: pnpm lint
      - name: Find unused code and dependencies
        run: pnpm knip
      - name: Check formatting
        run: pnpm format:check
      - name: Build the static export
        run: pnpm build
      - name: Install the browser and system dependencies
        run: pnpm exec playwright install --with-deps chrome
      - name: Run browser tests
        run: pnpm test:browser --workers=2
